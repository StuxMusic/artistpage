<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://global.media.stux.music/icon.png">
    <meta name="description" content="Everything that's changed on this Stux.Music placeholder page, release by release.">
    <title>Changelog · Stux.Music</title>
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #121214; --surface: #1b1b1f; --text: #f2f2f5; --muted: #a8a8b3;
            --border: rgba(255, 255, 255, 0.08); --accent: #4752ff; --accent-bg: rgba(71, 82, 255, 0.14);
        }
        [data-theme="light"] {
            --bg: #f5f5fa; --surface: #ffffff; --text: #111118; --muted: #5a5a78;
            --border: rgba(0, 0, 0, 0.07); --accent: #000ccc; --accent-bg: rgba(0, 12, 204, 0.1);
        }

        html, body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; min-height: 100%; transition: background 0.3s, color 0.3s; }
        a, a:visited { color: var(--accent); text-decoration: none; }
        a:hover, a:focus { opacity: 0.8; }

        .site-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 6%; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; color: var(--text); }
        .brand img { height: 32px; width: auto; }
        #theme-toggle {
            background: var(--accent-bg); border: 1px solid var(--border); border-radius: 50%;
            width: 38px; height: 38px; text-align: center; cursor: pointer; padding: 0; color: var(--accent);
            display: flex; align-items: center; justify-content: center; transition: background 0.2s;
        }
        #theme-toggle:hover { opacity: 0.85; }

        main { max-width: 780px; margin: 0 auto; padding: 10px 6% 60px; }
        h1 { font-weight: 800; font-size: clamp(1.8rem, 4vw, 2.6rem); margin: 10px 0 6px; }
        .subtitle { color: var(--muted); font-size: 1.05rem; margin: 0 0 32px; line-height: 1.6; }

        .changelog-entry { padding: 20px 22px; margin: 0 0 16px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
        .changelog-entry-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 0 0 10px; }
        .changelog-version { margin: 0; font-size: 1.15rem; color: var(--text); font-weight: 700; }

        .changelog-label-row { margin: 14px 0 8px; }
        .changelog-label-row:first-of-type { margin-top: 0; }
        /* Fixed type palette: Added green, Changed blue, Fixed orange, Removed red, Security purple, Deprecated grey. */
        .changelog-label {
            --cl: #8a8a94;
            display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; line-height: 1.4; text-transform: uppercase;
            padding: 3px 10px; border-radius: 999px; color: var(--cl);
            background: color-mix(in srgb, var(--cl) 14%, transparent);
            border: 1px solid color-mix(in srgb, var(--cl) 45%, transparent);
        }
        .changelog-label-added      { --cl: #2ecc71; }
        .changelog-label-changed    { --cl: #3ba7ff; }
        .changelog-label-fixed      { --cl: #ffa64d; }
        .changelog-label-removed    { --cl: #ff4d4d; }
        .changelog-label-security   { --cl: #b06bff; }
        .changelog-label-deprecated { --cl: #8a8a94; }
        /* Light theme: same hues, darkened for text contrast on a white surface. */
        [data-theme="light"] .changelog-label-added      { --cl: #1e8449; }
        [data-theme="light"] .changelog-label-changed    { --cl: #1a73c9; }
        [data-theme="light"] .changelog-label-fixed      { --cl: #b35900; }
        [data-theme="light"] .changelog-label-removed    { --cl: #cc2929; }
        [data-theme="light"] .changelog-label-security   { --cl: #7d3cc9; }
        [data-theme="light"] .changelog-label-deprecated { --cl: #5f5f6a; }

        .changelog-list { margin: 0 0 4px; padding-left: 20px; color: var(--muted); font-size: 0.92rem; line-height: 1.65; }
        .changelog-list li { margin: 0 0 4px; }
        .changelog-list code { background: var(--accent-bg); padding: 1px 5px; border-radius: 4px; font-size: 0.88em; }
        .changelog-p { color: var(--muted); font-size: 0.92rem; }

        footer { text-align: center; padding: 20px 6% 40px; font-size: 0.8rem; color: var(--muted); border-top: 1px solid var(--border); margin-top: 20px; }
        footer a, footer a:visited { color: var(--muted); font-weight: 400; }
        footer a:hover { opacity: 0.8; }
    </style>
</head>
<body>

<header class="site-header">
    <a class="brand" href="./"><img id="brand-icon" src="https://global.media.stux.music/icon-dark.png" alt="Stux.Music">
        <span>Stux.Music</span></a>
    <button type="button" id="theme-toggle" title="Toggle light/dark mode" aria-label="Toggle light/dark mode"><i class="fa-solid fa-moon"></i></button>
</header>

<main>
    <h1>Changelog</h1>
    <p class="subtitle">Everything that's changed on this artist placeholder page, release by release.</p>

    <div id="changelog-body">
        <p class="changelog-p">Loading changelog&hellip;</p>
    </div>
</main>

<footer>
    <p>Stux.Music is operated by Stux Group Ltd. &copy; 2026 Stux Group Ltd. All rights reserved.</p>
</footer>

<script>
    (function () {
        var root = document.documentElement;
        var btn = document.getElementById('theme-toggle');
        var icon = btn.querySelector('i');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var stored = localStorage.getItem('stuxmusic_theme');
        var isDark = stored ? stored === 'dark' : prefersDark;

        function apply(dark) {
            root.setAttribute('data-theme', dark ? 'dark' : 'light');
            icon.className = dark ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
            document.getElementById('brand-icon').src = dark ? 'https://global.media.stux.music/icon-light.png' : 'https://global.media.stux.music/icon-dark.png';
            btn.title = dark ? 'Switch to light mode' : 'Switch to dark mode';
        }

        apply(isDark);

        btn.addEventListener('click', function () {
            isDark = !isDark;
            localStorage.setItem('stuxmusic_theme', isDark ? 'dark' : 'light');
            apply(isDark);
        });
    })();
</script>
<script>
    (function () {
        var target = document.getElementById('changelog-body');
        // Fixed render order; ### sections are sorted into this order within each release (unknown types last).
        var CATEGORIES = ['Added', 'Changed', 'Fixed', 'Removed', 'Security', 'Deprecated'];

        function sectionRank(headingLine) {
            var word = headingLine.replace(/^###\s+/, '').trim().split(/[\s:]/)[0].toLowerCase();
            for (var i = 0; i < CATEGORIES.length; i++) {
                if (CATEGORIES[i].toLowerCase() === word) return i;
            }
            return CATEGORIES.length;
        }
        function sortSections(md) {
            var lines = md.replace(/\r\n/g, '\n').split('\n');
            var out = [];
            var release = null;
            function flush() {
                if (!release) return;
                var head = release[0], body = release.slice(1), idx = [];
                body.forEach(function (l, i) { if (/^###\s+/.test(l)) idx.push(i); });
                if (idx.length < 2) { out = out.concat(release); release = null; return; }
                var chunks = idx.map(function (s, k) { return { lines: body.slice(s, k + 1 < idx.length ? idx[k + 1] : body.length), pos: k }; });
                chunks.sort(function (a, b) { return (sectionRank(a.lines[0]) - sectionRank(b.lines[0])) || (a.pos - b.pos); });
                out.push(head);
                out = out.concat(body.slice(0, idx[0]));
                chunks.forEach(function (c) {
                    var l = c.lines.slice();
                    while (l.length && l[l.length - 1].trim() === '') l.pop();
                    out = out.concat(l, ['']);
                });
                release = null;
            }
            lines.forEach(function (l) {
                if (/^##\s+/.test(l)) { flush(); release = [l]; }
                else if (release) release.push(l);
                else out.push(l);
            });
            flush();
            return out.join('\n');
        }

        function esc(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
        function inline(s) {
            s = esc(s);
            s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
            s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            return s;
        }
        function renderChangelog(md) {
            var lines = sortSections(md).trim().split('\n');
            var html = '';
            var inEntry = false;
            var inList = false;
            var itemBuf = null;
            var catPattern = new RegExp('^(' + CATEGORIES.join('|') + ')\\b\\s*(.*)$');

            function flushItem() { if (itemBuf !== null) { html += '<li>' + inline(itemBuf) + '</li>\n'; itemBuf = null; } }
            function flushList() { flushItem(); if (inList) { html += '</ul>\n'; inList = false; } }
            function flushEntry() { flushList(); if (inEntry) { html += '</div>\n'; inEntry = false; } }

            lines.forEach(function (raw) {
                var line = raw.replace(/\s+$/, '');
                if (line.trim() === '') { flushItem(); return; }

                var m = line.match(/^##\s+(.+)$/);
                if (m) {
                    flushEntry();
                    html += '<div class="changelog-entry"><div class="changelog-entry-head"><h3 class="changelog-version">' + esc(m[1].trim()) + '</h3></div>\n';
                    inEntry = true;
                    return;
                }

                m = line.match(/^###\s+(.+)$/);
                if (m) {
                    flushList();
                    var text = m[1].trim();
                    var cm = text.match(catPattern);
                    if (cm) {
                        html += '<div class="changelog-label-row"><span class="changelog-label changelog-label-' + cm[1].toLowerCase() + '">' + cm[1] + '</span></div>\n';
                    } else {
                        html += '<h4 class="changelog-section">' + esc(text) + '</h4>\n';
                    }
                    return;
                }

                m = line.match(/^-\s+(.+)$/);
                if (m) {
                    flushItem();
                    if (!inList) { html += '<ul class="changelog-list">\n'; inList = true; }
                    itemBuf = m[1].trim();
                    return;
                }

                if (/^#\s+/.test(line)) { flushItem(); return; }

                if (inList && itemBuf !== null) {
                    itemBuf += ' ' + line.trim();
                }
            });

            flushEntry();
            target.innerHTML = html || '<p class="changelog-p">No changelog entries yet.</p>';
        }

        fetch('CHANGELOG.md')
            .then(function (r) {
                if (!r.ok) throw new Error('fetch failed');
                return r.text();
            })
            .then(renderChangelog)
            .catch(function () {
                target.innerHTML = '<p class="changelog-p">Couldn’t load the changelog right now &mdash; see <a href="https://github.com/StuxMusic/artistpage/blob/main/CHANGELOG.md">CHANGELOG.md</a> on GitHub instead.</p>';
            });
    })();
</script>
</body>
</html>
