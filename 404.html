<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://global.media.stux.music/icon.png">
    <meta name="description" content="Page not found — Stux.Music">
    <title>Page Not Found — Stux.Music</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #121214; --text: #f2f2f5; --muted: #a8a8b3;
            --accent: #4752ff; --accent-bg: rgba(71, 82, 255, 0.14); --border: rgba(255, 255, 255, 0.08);
        }
        [data-theme="light"] {
            --bg: #f5f5fa; --text: #111118; --muted: #5a5a78;
            --accent: #000ccc; --accent-bg: rgba(0, 12, 204, 0.1); --border: rgba(0, 0, 0, 0.07);
        }

        html, body {
            background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; transition: background 0.3s, color 0.3s;
        }

        a, a:visited { color: var(--accent); text-decoration: none; }
        a:hover, a:focus { opacity: 0.8; }

        .wrapper { padding: 2rem 1.5rem; max-width: 420px; }
        .code { font-weight: 800; font-size: clamp(3.5rem, 12vw, 5.5rem); line-height: 1; color: var(--accent); margin-bottom: 0.5rem; }
        h1 { font-weight: 800; font-size: clamp(1.3rem, 4vw, 1.7rem); margin-bottom: 0.75rem; }
        p { color: var(--muted); font-size: 0.95rem; line-height: 1.7; margin-bottom: 1.75rem; }

        .home-link {
            display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 10px;
            font-size: 14px; font-weight: 500; border: 1px solid var(--border); background: var(--accent-bg); transition: opacity 0.2s;
        }
        .home-link:hover { opacity: 0.85; }

        #theme-toggle {
            position: fixed; top: 14px; right: 14px; z-index: 100; background: var(--accent-bg); border: 1px solid var(--border);
            border-radius: 50%; width: 38px; height: 38px; text-align: center; cursor: pointer;
            padding: 0; color: var(--accent); display: flex; align-items: center; justify-content: center; transition: background 0.2s;
        }
        #theme-toggle:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <button id="theme-toggle" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">&#9788;</button>

    <div class="wrapper">
        <div class="code">404</div>
        <h1>Page not found</h1>
        <p>Whatever you were looking for isn't here &mdash; the link might be old, or the page might have moved.</p>
        <a class="home-link" href="./">&larr; Back to Stux.Music</a>
    </div>

    <script>
        (function () {
            var root = document.documentElement;
            var btn = document.getElementById('theme-toggle');
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            var stored = localStorage.getItem('stuxmusic_theme');
            var isDark = stored ? stored === 'dark' : prefersDark;

            function apply(dark) {
                root.setAttribute('data-theme', dark ? 'dark' : 'light');
                btn.textContent = dark ? '☀' : '☾';
                btn.title = dark ? 'Switch to light mode' : 'Switch to dark mode';
            }

            apply(isDark);

            btn.addEventListener('click', function () {
                isDark = !isDark;
                localStorage.setItem('stuxmusic_theme', isDark ? 'dark' : 'light');
                apply(isDark);
            });
        })();
    </script>
</body>
</html>
